<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Оплата — Рустем Глюмов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --ink: #000000;
      --muted: #6b6b6b;
      --highlight: #cc7c5e;
      --blue: #2f62d0;
      --orange: #ff5a36;
      --yellow: #cc7c5e;
      --dash: #000000;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #000000;
        --ink: #ffffff;
        --muted: #a3a3a3;
        --blue: #7aa2ff;
        --dash: #ffffff;
      }
    }
    :root[data-theme="dark"] {
      --bg: #000000;
      --ink: #ffffff;
      --muted: #a3a3a3;
      --blue: #7aa2ff;
      --dash: #ffffff;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: .14em;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { color: inherit; }

    /* Left navigation */
    .side {
      position: fixed;
      top: 24px;
      left: 20px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 18px;
      font-size: 15px;
      text-transform: uppercase;
    }
    .side a { text-decoration: none; }
    .side a:hover { text-decoration: underline; text-underline-offset: 5px; }
    .side .current { color: var(--blue); }
    .side .current::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 14px;
      border-radius: 50%;
      background: var(--blue);
      vertical-align: 1px;
    }
    .side .cta, .side .lang { text-decoration: underline; text-underline-offset: 5px; }

    /* Floating math symbols */
    .glyphs { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .glyphs span {
      position: absolute;
      font-size: 18px;
      letter-spacing: 0;
      animation: drift 9s ease-in-out infinite alternate;
    }
    .glyphs .p { color: var(--blue); }
    .glyphs .o { color: var(--orange); }
    .glyphs .y { color: var(--yellow); }
    @keyframes drift {
      from { transform: translate(0, 0); }
      to { transform: translate(6px, -10px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .glyphs span { animation: none; }
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 96px 60px 120px 340px;
      text-align: center;
    }

    /* Hero */
    .photo {
      display: block;
      width: 96px;
      height: 96px;
      margin: 0 auto 36px;
      border: 1px dashed var(--dash);
      background: #ffffff;
    }
    h1 {
      margin: 0;
      font-weight: 400;
      font-size: clamp(26px, 4.4vw, 56px);
      letter-spacing: .22em;
      line-height: 1.15;
      text-transform: uppercase;
    }
    .mark {
      display: inline;
      padding: 4px 10px;
      background: var(--highlight);
      color: #000000;
      font-size: clamp(14px, 1.8vw, 19px);
      line-height: 2;
      text-transform: uppercase;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
    .highlight { margin: 48px 0 0; }
    /* Section heading: highlighted tag + gray note, like "Prizes" on yandex.com/cup/ml */
    .section { max-width: 820px; margin: 120px auto 0; text-align: left; }
    .tag {
      display: inline-block;
      margin: 0;
      padding: 4px 10px;
      background: var(--highlight);
      color: #000000;
      font-size: 18px;
      font-weight: 400;
      text-transform: uppercase;
    }
    .note { margin: 18px 0 0 30%; color: var(--muted); font-size: 16px; }
    .about {
      margin: 40px 0 0;
      font-size: clamp(16px, 1.9vw, 22px);
      line-height: 1.6;
      text-transform: uppercase;
    }

    /* Experience: zigzag steps joined by dashed arrows */
    .scheme { --shift: 45%; --r: 10px; margin-top: 56px; }
    .step { width: calc(100% - var(--shift)); }
    .step.right { margin-left: var(--shift); }
    .step .num { display: block; font-size: 18px; letter-spacing: 0; }
    .step .years {
      display: inline-block;
      margin-top: 10px;
      font-size: 20px;
      font-style: italic;
      letter-spacing: .08em;
      text-decoration: underline;
      text-underline-offset: 6px;
    }
    .step .role { margin: 14px 0 0 1.4em; font-size: 17px; text-transform: uppercase; }
    .step .what { margin: 6px 0 0 1.4em; color: var(--muted); font-size: 14px; letter-spacing: .06em; }
    .link { position: relative; width: var(--shift); height: 84px; margin: 24px 0 18px 8px; }
    .link::before, .link::after { content: ""; position: absolute; border: 0 dashed var(--ink); }
    .link::before {
      left: 0;
      top: 0;
      width: calc(100% - var(--r));
      height: 50%;
      border-left-width: 1.5px;
      border-bottom-width: 1.5px;
      border-bottom-left-radius: var(--r);
    }
    .link::after {
      right: 0;
      top: calc(50% - 1.5px);
      width: var(--r);
      height: 50%;
      border-top-width: 1.5px;
      border-right-width: 1.5px;
      border-top-right-radius: var(--r);
    }
    .link .head { position: absolute; right: -4.5px; bottom: -9px; font-size: 10px; letter-spacing: 0; line-height: 1; }
    .link.rev { transform: scaleX(-1); }

    .links {
      display: flex;
      justify-content: flex-start;
      margin-top: 32px;
      flex-wrap: wrap;
      gap: 12px 36px;
      font-size: 16px;
      text-transform: uppercase;
    }
    .links a { text-underline-offset: 6px; }
    .links a:hover { color: var(--blue); }

    /* Theme toggle, bottom-left dashed square */
    .theme {
      position: fixed;
      left: 2px;
      bottom: 2px;
      z-index: 2;
      width: 64px;
      height: 64px;
      border: 1px dashed var(--dash);
      background: var(--bg);
      color: var(--ink);
      font: inherit;
      font-size: 26px;
      letter-spacing: 0;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .side {
        position: static;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 12px 20px;
        padding: 20px 16px 0;
        font-size: 13px;
      }
      main { padding: 56px 16px 120px; }
      h1 { font-size: clamp(24px, 8vw, 40px); letter-spacing: .16em; }
      .section { margin-top: 80px; }
      .note { margin-left: 0; }
      .scheme { --shift: 22%; }
      .link { height: 60px; }
      .theme { width: 48px; height: 48px; font-size: 20px; }
    }

    /* Numbered step heading: ① + highlighted tag */
    .step-head { display: flex; align-items: center; gap: 14px; }
    .step-head .n { font-size: 22px; letter-spacing: 0; }
    .down { width: 16px; height: 72px; margin: 28px 0 0 4px; border-left: 1.5px dashed var(--ink); position: relative; }
    .down::after { content: "▼"; position: absolute; left: -6px; bottom: -10px; font-size: 10px; letter-spacing: 0; }
    .section.flow { margin-top: 28px; }
    .section.first { margin-top: 80px; }

    /* Format choices: dashed cards that turn solid when picked */
    .choices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 28px;
    }
    .choice {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 22px 22px 24px;
      border: 1.5px dashed var(--dash);
      cursor: pointer;
    }
    .choice input { position: absolute; opacity: 0; pointer-events: none; }
    .choice.on { border-style: solid; box-shadow: inset 0 0 0 1px var(--ink); }
    .choice:focus-within { outline: 2px solid var(--blue); outline-offset: 3px; }
    .choice .pick { font-size: 18px; letter-spacing: 0; }
    .choice h3 { margin: 0; font-size: 17px; font-weight: 400; text-transform: uppercase; }
    .choice .price {
      align-self: flex-start;
      padding: 3px 10px;
      background: var(--c);
      color: var(--on);
      font-size: 18px;
      font-weight: 500;
      letter-spacing: .08em;
      white-space: nowrap;
    }
    .choice .meta { color: var(--muted); font-size: 14px; letter-spacing: .06em; }
    .c-blue { --c: var(--blue); --on: #ffffff; }
    .c-claude { --c: var(--highlight); --on: #000000; }
    .c-orange { --c: var(--orange); --on: #000000; }

    .lead { margin: 22px 0 0; color: var(--muted); font-size: 15px; }
    .booking { margin-top: 20px; border: 1.5px dashed var(--dash); background: #ffffff; }
    .booking iframe { display: block; width: 100%; height: 720px; border: 0; }
    .booking .empty { padding: 72px 24px; color: var(--muted); font-size: 15px; text-align: center; }

    .total:empty { display: none; }
    .total { display: inline-block; margin: 14px 0 0; padding: 4px 12px; background: var(--highlight); color: #000000; font-size: 26px; font-weight: 500; letter-spacing: .08em; }
    .cta-link {
      display: inline-block;
      margin-top: 32px;
      font-size: 18px;
      text-transform: uppercase;
      text-decoration: underline;
      text-underline-offset: 6px;
    }
    .cta-link:hover { color: var(--blue); }

    /* SBP QR code */
    .qr {
      display: block;
      width: min(280px, 100%);
      aspect-ratio: 1;
      margin: 56px auto 0;
      padding: 16px;
      border: 1.5px dashed var(--dash);
      background: #ffffff;
    }
    .qr img { display: block; width: 100%; height: 100%; object-fit: contain; }

    /* Phone transfer, until the QR is added */
    .by-phone { margin-top: 56px; }
    .by-phone p { margin: 0; font-size: 18px; text-transform: uppercase; }
    .by-phone .phone { display: inline-block; margin-top: 18px; padding: 4px 12px; background: var(--highlight); color: #000000; font-size: 30px; font-weight: 500; letter-spacing: .08em; white-space: nowrap; }

    @media (max-width: 900px) {
      .section.first { margin-top: 56px; }
      .booking iframe { height: 640px; }
    }
  </style>
</head>
<body>
  <nav class="side" aria-label="Разделы">

  <main id="top">
    <h1 aria-label="Оплата"><span class="scramble" aria-hidden="true">Оплата</span></h1>
    <p class="highlight"><span class="mark">СБП</span></p>

    <div class="by-phone"><p>Перевод по номеру телефона в Райффайзенбанк</p><span class="phone">+7 903 138-86-49</span></div>
  </main>

  <button class="theme" type="button" aria-label="Сменить тему">☀</button>

  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.querySelector('.theme');
      function isDark() {
        var t = root.getAttribute('data-theme');
        if (t) return t === 'dark';
        return window.matchMedia('(prefers-color-scheme: dark)').matches;
      }
      function sync() { btn.textContent = isDark() ? '☾' : '☀'; }
      try {
        var saved = localStorage.getItem('theme');
        if (saved) root.setAttribute('data-theme', saved);
      } catch (e) {}
      sync();
      btn.addEventListener('click', function () {
        var next = isDark() ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        sync();
      });
    })();

    // Name decode, like yandex.ru/cup/ml: letters flicker through symbols, then settle one by one
    (function () {
      var el = document.querySelector('.scramble');
      if (!el || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var target = el.textContent;
      var noise = '!#_/Y<>*░▒▓█';
      var start = performance.now();
      var settle = Array.prototype.map.call(target, function (ch) {
        return /\s/.test(ch) ? 0 : 250 + Math.random() * 1150;
      });
      function frame(now) {
        var t = now - start, out = '', done = true;
        for (var i = 0; i < target.length; i++) {
          if (t >= settle[i]) out += target[i];
          else { out += noise[Math.floor(Math.random() * noise.length)]; done = false; }
        }
        el.textContent = out;
        if (!done) setTimeout(function () { requestAnimationFrame(frame); }, 50);
      }
      requestAnimationFrame(frame);
    })();
  </script>

  </script>
